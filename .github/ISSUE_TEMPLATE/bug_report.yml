name: Bug report
description: Report a reproducible app, receiver, or input problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version and device
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include Wi-Fi names, IP addresses, PINs, or other private information.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: binding
    attributes:
      label: Stratagem key bindings and hold timing
      placeholder: "Left Ctrl + arrow keys; 55 ms"
    validations:
      required: true
